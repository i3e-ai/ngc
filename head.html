<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- Preconnect to critical origins for faster resource loading -->
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- DNS prefetch for external resources -->
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<!-- Preload critical fonts for better performance -->
<link rel="preload" href="/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Geist-Bold.woff2" as="font" type="font/woff2" crossorigin>
<!-- Removed broken font preload that was causing 404 errors -->
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<!-- Service Worker Registration -->
<script nonce="aem">
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('SW registered: ', registration);
        })
        .catch((registrationError) => {
          console.log('SW registration failed: ', registrationError);
        });
    });
  }
</script>
<link rel="stylesheet" href="/styles/styles.css" media="print" onload="this.media='all'"/>
<noscript><link rel="stylesheet" href="/styles/styles.css"/></noscript>
